# Render's free plan puts the API to sleep after 15 idle minutes, and the next visitor then waits about a
# minute while it wakes. Pinging the health check every 10 minutes keeps it awake. Free for public
# repositories; one always-on free service fits in Render's 750 free hours a month.
# GitHub may delay scheduled runs at busy times and pauses them after 60 days without repository activity.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping the health check
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 https://pramiti-api.onrender.com/api/health
