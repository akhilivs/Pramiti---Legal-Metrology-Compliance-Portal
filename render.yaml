# Render Blueprint for the Pramiti backend, on the free plan (the frontend is deployed on Vercel).
# Render dashboard -> New -> Blueprint -> pick this repository. Values marked sync: false are
# asked for once at creation and stay in Render's secret settings, never in this file.
#
# The free plan has no persistent disk, so data lives in a free hosted Postgres database (Neon):
# inspections, notices and users, plus a copy of every photo that is written back on each restart.
services:
  - type: web
    name: pramiti-api
    runtime: python
    rootDir: backend
    plan: free               # sleeps after 15 idle minutes; the first request then takes ~1 minute
    region: singapore        # nearest to India; create the Neon database in Singapore too
    buildCommand: pip install -r requirements.txt
    # Trust Render's proxy headers so photo links are built as https://
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: PRAMITI_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false          # Neon connection string, postgresql://...neon.tech/...?sslmode=require
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false          # the Vercel URL, e.g. https://pramiti.vercel.app
      - key: GOOGLE_CLIENT_ID
        sync: false          # optional; leave empty to hide Google sign-in
