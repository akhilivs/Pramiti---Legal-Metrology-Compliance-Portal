# Render Blueprint for the Pramiti backend (the frontend is deployed on Vercel).
# Render dashboard -> New -> Blueprint -> pick this repository. Values marked sync: false are
# asked for once at creation and stay in Render's secret settings, never in this file.
services:
  - type: web
    name: pramiti-api
    runtime: python
    rootDir: backend
    plan: starter            # a persistent disk needs a paid instance
    numInstances: 1          # bulk-scan worker and complaint rate limit assume one server
    buildCommand: pip install -r requirements.txt
    # Trust Render's proxy headers so photo links are built as https://
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    disk:
      name: pramiti-data
      mountPath: /var/data   # database and photos live here and survive restarts and deploys
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: PRAMITI_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////var/data/compliance.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false          # the Vercel URL, e.g. https://pramiti.vercel.app
      - key: GOOGLE_CLIENT_ID
        sync: false          # optional; leave empty to hide Google sign-in
